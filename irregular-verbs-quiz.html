/* ═══════════════════════════════════════════════════════
   ░░  AUDIO  ░░
═══════════════════════════════════════════════════════ */
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playTone(freq, type, duration, gain, delay = 0) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();
    osc.connect(vol); vol.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    vol.gain.setValueAtTime(gain, ctx.currentTime + delay);
    vol.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
}
function playSuccess() {
    [[523,.00],[659,.10],[784,.20],[1047,.32]].forEach(([f,d]) => playTone(f,'sine',.35,.28,d));

/* ═══════════════════════════════════════════════════════

function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = 'block';
    const ctx2 = canvas.getContext('2d');
    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bcd','#ff9f43','#a29bfe','#fd79a8'];
    const pieces = Array.from({length:160}, () => ({
        x: Math.random()*canvas.width, y: -10 - Math.random()*80,
        w: 6+Math.random()*10, h: 4+Math.random()*6,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        vy: 2.5+Math.random()*3, vx: (Math.random()-.5)*2.5,
        rot: Math.random()*360, spin: (Math.random()-.5)*6,
    }));
    let frame = 0;
    function draw() {
        ctx2.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
            p.y+=p.vy; p.x+=p.vx; p.rot+=p.spin;
            ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.rot*Math.PI/180);
            ctx2.fillStyle=p.color; ctx2.globalAlpha=Math.max(0,1-frame/220);
            ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx2.restore();
        });
        frame++;
        if (frame < 240) requestAnimationFrame(draw);
        else canvas.style.display = 'none';
    }
    draw();
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function checkAnswer(input, correctList) {
    return correctList.some(c => c.toLowerCase() === input.trim().toLowerCase());
}
function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showQuestion() {
    awaitingNext = false;
    const v = quizVerbs[currentIndex];

    document.getElementById('question-counter').textContent = `${currentIndex+1} / ${total}`;

    document.getElementById('slovenian-word').textContent = v.sl;

    const verbInp = document.getElementById('verb-input');
    const pastInp = document.getElementById('past-input');
    verbInp.value = ''; pastInp.value = '';
    verbInp.disabled = false; pastInp.disabled = false;

    pastInp.classList.remove('input-ok','input-err');
    verbInp.focus();

    fb.className = 'hidden'; fb.innerHTML = '';

    const userPast = pastInp.value.trim();
    const v = quizVerbs[currentIndex];

    const verbOk = userVerb.toLowerCase() === v.verb.toLowerCase();
    const pastOk = checkAnswer(userPast, v.past);
    const ok = verbOk && pastOk;

    verbInp.disabled = true; pastInp.disabled = true;
    document.getElementById('submit-btn').disabled = true;
    verbInp.classList.add(verbOk ? 'input-ok' : 'input-err');
    pastInp.classList.add(pastOk ? 'input-ok' : 'input-err');

    results.push({ verb:v.verb, past:v.past, sl:v.sl, userVerb, userPast, verbOk, pastOk, isCorrect:ok });

    const fb = document.getElementById('feedback');
    if (ok) {
        correctCount++;
        fb.className = 'correct';
        fb.innerHTML = `<div>🎉 Bravo! Vse pravilno!</div>`;
        playSuccess(); launchConfetti();
        awaitingNext = true;
        setTimeout(nextQuestion, 1800);
    } else {
        wrongCount++;
        let lines = [];
        if (!verbOk) lines.push(`Glagol: <strong>${escHtml(v.verb)}</strong> &nbsp;(vpisal/-a si: <em>${escHtml(userVerb||'—')}</em>)`);
        if (!pastOk) lines.push(`Past Simple: <strong>${escHtml(v.past.join(' / '))}</strong> &nbsp;(vpisal/-a si: <em>${escHtml(userPast||'—')}</em>)`);
        fb.className = 'wrong';
        fb.innerHTML = `<div>❌ Napaka! Pravilno je:</div>
            <div class="feedback-lines">${lines.join('<br>')}</div>
            <button class="btn-next" onclick="nextQuestion()">Naprej →</button>`;
        playError();
        awaitingNext = true;
    }

    document.getElementById('score-display').innerHTML =
        `<span class="score-correct">✓ ${correctCount}</span> &nbsp; <span class="score-wrong">✗ ${wrongCount}</span>`;
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= quizVerbs.length) showResults();
    else showQuestion();
}

/* ═══════════════════════════════════════════════════════
   ░░  RESULTS  ░░
═══════════════════════════════════════════════════════ */
function showResults() {
    document.getElementById('progress-bar').style.width = '100%';
    showScreen('screen-results');

    const total = quizVerbs.length;
    const pct   = Math.round((correctCount/total)*100);

    let emoji, msg;
    if (pct===100)    { emoji='🏆'; msg=`Perfektno! Vse pravilno! Bravo, ${playerName}!`; }
    else if (pct>=80) { emoji='⭐'; msg=`Odlično, ${playerName}! Skoraj popolno!`; }
    else if (pct>=60) { emoji='👍'; msg=`Dobro, ${playerName}! Še malo vaditi in bo perfektno!`; }
    else if (pct>=40) { emoji='📚'; msg=`${playerName}, vadi naprej – naslednjič bo boljše!`; }
    else              { emoji='💪'; msg=`${playerName}, ne obupaj! Ponovi glagole in poskusi znova!`; }

    document.getElementById('results-emoji').textContent = emoji;
    document.getElementById('results-score').innerHTML =
        `<span class="num">${correctCount}</span> / ${total} <small style="font-size:1.2rem;color:#6b7280">(${pct}%)</small>`;
    document.getElementById('results-message').textContent = msg;

    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = '';
    results.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.className = r.isCorrect ? 'row-correct' : 'row-wrong';
        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${escHtml(r.sl)}</td>
            <td>${escHtml(r.verb)}</td>
            <td>${escHtml(r.past.join(' / '))}</td>
            <td><span class="badge ${r.verbOk?'badge-ok':'badge-err'}">${escHtml(r.userVerb||'—')}</span></td>
            <td><span class="badge ${r.pastOk?'badge-ok':'badge-err'}">${escHtml(r.userPast||'—')}</span></td>
            <td><span class="badge ${r.isCorrect?'badge-ok':'badge-err'}">${r.isCorrect?'✓':'✗'}</span></td>`;
        tbody.appendChild(tr);
    });

    if (pct === 100) { playSuccess(); launchConfetti(); }

    // Auto-send email immediately
    sendResultsEmail();
}

/* ═══════════════════════════════════════════════════════
   ░░  EMAIL  ░░
═══════════════════════════════════════════════════════ */
function buildResultsText() {
    const total = quizVerbs.length;
    const pct   = Math.round((correctCount/total)*100);
    const rows  = results.map((r,i) =>
        `${i+1}. [${r.isCorrect?'✓':'✗'}] ${r.sl}\n` +
        `   Glagol:      ${r.verb}           | Vpisal/-a: ${r.userVerb||'—'} [${r.verbOk?'✓':'✗'}]\n` +
        `   Past Simple: ${r.past.join('/')} | Vpisal/-a: ${r.userPast||'—'} [${r.pastOk?'✓':'✗'}]`
    ).join('\n\n');
    return `Ime: ${playerName}\nRezultat: ${correctCount}/${total} (${pct}%)\nDatum: ${new Date().toLocaleString('sl-SI')}\n\n${rows}`;
}

async function sendResultsEmail() {
    const status   = document.getElementById('email-status');
    const retryBtn = document.getElementById('retry-email-btn');

    status.className     = 'sending';
    status.style.display = 'block';
    status.textContent   = '⏳ Pošiljam rezultate na email…';
    retryBtn.style.display = 'none';

    const total   = quizVerbs.length;
    const pct     = Math.round((correctCount/total)*100);
    const payload = {
        player_name:  playerName,
        score:        `${correctCount} / ${total} (${pct}%)`,
        results_text: buildResultsText(),
        date:         new Date().toLocaleString('sl-SI'),
    };

    // Collect unique recipients – always include the default address
    const recipients = [DEFAULT_EMAIL];
    const extra = recipientEmail.toLowerCase();
    if (extra && extra !== DEFAULT_EMAIL.toLowerCase()) recipients.push(recipientEmail);

    try {
        await Promise.all(recipients.map(addr =>
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { ...payload, to_email: addr })
        ));
        const sent = recipients.join(' in ');
        status.className  = 'sent';
        status.textContent = '✅ Rezultati poslani na ' + sent;
    } catch(err) {
        console.error(err);
        status.className  = 'error';
        status.textContent = '❌ Email ni bil poslan: ' + (err.text || err.message || 'Neznana napaka');
        retryBtn.style.display = 'block';
    }
}

/* ═══════════════════════════════════════════════════════
   ░░  EVENT LISTENERS  ░░
═══════════════════════════════════════════════════════ */
document.querySelectorAll('.count-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        questionCount = parseInt(btn.dataset.count);
    });
});

document.getElementById('start-btn').addEventListener('click', startQuiz);
document.getElementById('player-name').addEventListener('keydown', e => { if(e.key==='Enter') startQuiz(); });

document.getElementById('submit-btn').addEventListener('click', submitAnswer);

// Enter on verb → focus past
document.getElementById('verb-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('past-input').focus();
});
// Enter on past → submit
document.getElementById('past-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
});

document.getElementById('retry-email-btn').addEventListener('click', sendResultsEmail);

document.getElementById('replay-btn').addEventListener('click', () => {
    showScreen('screen-start');
    document.getElementById('email-status').style.display = 'none';
    document.getElementById('retry-email-btn').style.display = 'none';
});
</script>
</body>
</html>
