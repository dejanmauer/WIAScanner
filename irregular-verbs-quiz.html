<!DOCTYPE html>
<html lang="sl">
<head>

    <style>

        }

        .screen.active { display: block; }

        /* ── Card ── */

            animation: slideUp .4s ease;
        }

            to   { opacity: 1; transform: translateY(0); }

        }
        .subtitle { text-align: center; color: #7c3aed; font-weight: 700; font-size: 1.05rem; margin-bottom: 28px; }

        /* ── Form elements ── */
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 800; color: #374151; margin-bottom: 8px; font-size: 1rem; }

        input[type="text"] {
            width: 100%;
            border: 3px solid #e0e7ff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #1f2937;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.15);
        }

        .count-grid {
            display: flex; flex-wrap: wrap; gap: 10px;
        }

            padding: 12px 8px;
            border: 3px solid #e0e7ff;
            border-radius: 14px;
            background: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 800;
            color: #6366f1;
            cursor: pointer;
            transition: all .2s;
        }
        .count-btn:hover  { border-color: #6366f1; background: #eef2ff; }
        .count-btn.active { border-color: #6366f1; background: #6366f1; color: #fff; }

        /* ── Buttons ── */
        .btn-primary {
            display: block; width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none; border-radius: 16px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem; font-weight: 900;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            box-shadow: 0 6px 20px rgba(99,102,241,.35);

        .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,.45); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {

            background: #fff;
            color: #6366f1;
            border: 3px solid #6366f1;

/* ═══════════════════════════════════════════════════════
   ░░  STATE  ░░
═══════════════════════════════════════════════════════ */
let playerName   = "";
let questionCount = 10;
let quizVerbs    = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount   = 0;
let results      = [];   // {verb, past, sl, userAnswer, isCorrect}
let awaitingNext = false;

/* ═══════════════════════════════════════════════════════
   ░░  AUDIO  ░░
═══════════════════════════════════════════════════════ */
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playTone(freq, type, duration, gain, delay = 0) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();
    osc.connect(vol);
    vol.connect(ctx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    vol.gain.setValueAtTime(gain, ctx.currentTime + delay);
    vol.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
}

function playSuccess() {
    // Ascending major arpeggio: C5 E5 G5 C6
    [[523,.00],[659,.10],[784,.20],[1047,.32]].forEach(([f,d]) => playTone(f,'sine',.35,.28,d));
}

function playError() {
    // Short descending buzz
    playTone(220,'sawtooth',.15,.2,0);
    playTone(160,'sawtooth',.25,.2,.12);
}

/* ═══════════════════════════════════════════════════════
   ░░  CONFETTI  ░══════════════════════════════════════ */
function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';
    const ctx2 = canvas.getContext('2d');
    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bcd','#ff9f43','#a29bfe','#fd79a8'];
    const pieces = Array.from({length:160}, () => ({
        x:     Math.random() * canvas.width,
        y:     -10 - Math.random() * 80,
        w:     6  + Math.random() * 10,
        h:     4  + Math.random() * 6,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        vy:    2.5 + Math.random() * 3,
        vx:    (Math.random()-0.5) * 2.5,
        rot:   Math.random() * 360,
        spin:  (Math.random()-0.5) * 6,
    }));
    let frame = 0;
    function draw() {
        ctx2.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
            p.y   += p.vy;
            p.x   += p.vx;
            p.rot += p.spin;
            ctx2.save();
            ctx2.translate(p.x, p.y);
            ctx2.rotate(p.rot * Math.PI/180);
            ctx2.fillStyle = p.color;
            ctx2.globalAlpha = Math.max(0, 1 - frame/220);
            ctx2.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx2.restore();
        });
        frame++;
        if (frame < 240) requestAnimationFrame(draw);
        else canvas.style.display = 'none';
    }
    draw();
}

/* ═══════════════════════════════════════════════════════
   ░░  UTILITIES  ░░
═══════════════════════════════════════════════════════ */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function checkAnswer(input, correctList) {
    const clean = input.trim().toLowerCase();
    return correctList.some(c => c.toLowerCase() === clean);
}

/* ═══════════════════════════════════════════════════════
   ░░  QUIZ FLOW  ░░
═══════════════════════════════════════════════════════ */
function startQuiz() {
    playerName   = document.getElementById('player-name').value.trim() || "Učenec";
    quizVerbs    = shuffle(VERBS).slice(0, questionCount);
    currentIndex = 0;
    correctCount = 0;
    wrongCount   = 0;
    results      = [];
    showScreen('screen-quiz');
    showQuestion();
}

function showQuestion() {
    awaitingNext = false;
    const v = quizVerbs[currentIndex];
    const total = quizVerbs.length;

    document.getElementById('question-counter').textContent =
        `${currentIndex+1} / ${total}`;
    document.getElementById('score-display').innerHTML =
        `<span class="score-correct">✓ ${correctCount}</span> &nbsp; <span class="score-wrong">✗ ${wrongCount}</span>`;
    document.getElementById('progress-bar').style.width =
        ((currentIndex / total) * 100) + '%';
    document.getElementById('slovenian-word').textContent = v.sl;

    const inp = document.getElementById('answer-input');
    inp.value = '';
    inp.disabled = false;
    inp.focus();

    const fb = document.getElementById('feedback');
    fb.className = 'hidden';
    fb.innerHTML = '';

    document.getElementById('submit-btn').disabled = false;
}

function submitAnswer() {
    if (awaitingNext) return;
    const inp   = document.getElementById('answer-input');
    const ans   = inp.value;
    const v     = quizVerbs[currentIndex];
    const ok    = checkAnswer(ans, v.past);
    const fb    = document.getElementById('feedback');

    inp.disabled = true;
    document.getElementById('submit-btn').disabled = true;

    results.push({ verb: v.verb, past: v.past, sl: v.sl, userAnswer: ans.trim(), isCorrect: ok });

    if (ok) {
        correctCount++;
        fb.className = 'correct';
        fb.innerHTML = `<div>🎉 Bravo! Pravilno!</div><span class="correct-answer">${v.past[0]}</span>`;
        playSuccess();
        launchConfetti();
        awaitingNext = true;
        setTimeout(nextQuestion, 1800);
    } else {
        wrongCount++;
        fb.className = 'wrong';
        fb.innerHTML = `<div>❌ Napaka! Pravilno je:</div>
            <span class="correct-answer">${v.past.join(' / ')}</span>
            <br><button class="btn-next" onclick="nextQuestion()">Naprej →</button>`;
        playError();
        awaitingNext = true;
    }

    document.getElementById('score-display').innerHTML =
        `<span class="score-correct">✓ ${correctCount}</span> &nbsp; <span class="score-wrong">✗ ${wrongCount}</span>`;
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= quizVerbs.length) {
        showResults();
    } else {
        showQuestion();
    }
}

/* ═══════════════════════════════════════════════════════
   ░░  RESULTS  ░░
═══════════════════════════════════════════════════════ */
function showResults() {
    document.getElementById('progress-bar').style.width = '100%';
    showScreen('screen-results');

    const total = quizVerbs.length;
    const pct   = Math.round((correctCount / total) * 100);

    // Emoji & message
    let emoji, msg;
    if (pct === 100)      { emoji = '🏆'; msg = 'Perfektno! Vse pravilno! Bravo, ' + playerName + '!'; }
    else if (pct >= 80)   { emoji = '⭐'; msg = 'Odlično, ' + playerName + '! Skoraj popolno!'; }
    else if (pct >= 60)   { emoji = '👍'; msg = 'Dobro, ' + playerName + '! Še malo vaditi in bo perfektno!'; }
    else if (pct >= 40)   { emoji = '📚'; msg = playerName + ', vadi naprej – naslednjič bo boljše!'; }
    else                  { emoji = '💪'; msg = playerName + ', ne obupaj! Ponovi glagole in poskusi znova!'; }

    document.getElementById('results-emoji').textContent   = emoji;
    document.getElementById('results-score').innerHTML     =
        `<span class="num">${correctCount}</span> / ${total} <small style="font-size:1.2rem;color:#6b7280">(${pct}%)</small>`;
    document.getElementById('results-message').textContent = msg;

    // Table
    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = '';
    results.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.className = r.isCorrect ? 'row-correct' : 'row-wrong';
        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${escHtml(r.sl)}</td>
            <td>${escHtml(r.past.join(' / '))}</td>
            <td>${escHtml(r.userAnswer || '—')}</td>
            <td><span class="badge ${r.isCorrect ? 'badge-ok' : 'badge-err'}">${r.isCorrect ? '✓' : '✗'}</span></td>`;
        tbody.appendChild(tr);
    });

    if (pct === 100) { playSuccess(); launchConfetti(); }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══════════════════════════════════════════════════════
   ░░  EMAIL (EmailJS)  ░░
═══════════════════════════════════════════════════════ */
function buildResultsText() {
    const total = quizVerbs.length;
    const pct   = Math.round((correctCount / total) * 100);
    let rows = results.map((r,i) =>
        `${i+1}. [${r.isCorrect?'✓':'✗'}] ${r.sl} → Pravilno: ${r.past.join('/')} | Odgovor: ${r.userAnswer||'—'}`
    ).join('\n');
    return `Ime: ${playerName}\nRezultat: ${correctCount}/${total} (${pct}%)\n\n${rows}`;
}

function buildResultsHtml() {
    const total = quizVerbs.length;
    const pct   = Math.round((correctCount / total) * 100);
    let rows = results.map((r,i) => {
        const color = r.isCorrect ? '#d1fae5' : '#fee2e2';
        const icon  = r.isCorrect ? '✅' : '❌';
        return `<tr style="background:${color}">
            <td style="padding:6px 10px">${i+1}</td>
            <td style="padding:6px 10px">${escHtml(r.sl)}</td>
            <td style="padding:6px 10px">${escHtml(r.past.join(' / '))}</td>
            <td style="padding:6px 10px">${escHtml(r.userAnswer||'—')}</td>
            <td style="padding:6px 10px">${icon}</td>
        </tr>`;
    }).join('');

    return `<h2>Rezultati kviza – Nepravilni glagoli (6. razred)</h2>
<p><strong>Ime:</strong> ${escHtml(playerName)}</p>
<p><strong>Rezultat:</strong> ${correctCount} / ${total} (${pct}%)</p>
<br>
<table border="1" cellspacing="0" style="border-collapse:collapse;font-family:sans-serif">
  <tr style="background:#eef2ff">
    <th style="padding:8px 12px">#</th>
    <th style="padding:8px 12px">Slovensko</th>
    <th style="padding:8px 12px">Pravilno</th>
    <th style="padding:8px 12px">Odgovor učenca</th>
    <th style="padding:8px 12px">Status</th>
  </tr>
  ${rows}
</table>`;
}

async function sendResultsEmail() {
    const btn    = document.getElementById('email-btn');
    const status = document.getElementById('email-status');

    btn.disabled             = true;
    status.className         = 'sending';
    status.style.display     = 'block';
    status.textContent       = '⏳ Pošiljam…';

    const total = quizVerbs.length;
    const pct   = Math.round((correctCount / total) * 100);

    try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            player_name:  playerName,
            score:        `${correctCount} / ${total} (${pct}%)`,
            results_text: buildResultsText(),
            date:         new Date().toLocaleString('sl-SI'),
        });
        status.className  = 'sent';
        status.textContent = '✅ Email uspešno poslan na ' + RECIPIENT_EMAIL;
    } catch(err) {
        console.error(err);
        status.className  = 'error';
        status.textContent = '❌ Napaka: ' + (err.text || err.message || 'Neznana napaka');
        btn.disabled = false;
    }
}

/* ═══════════════════════════════════════════════════════
   ░░  EVENT LISTENERS  ░░
═══════════════════════════════════════════════════════ */

// Count selector
document.querySelectorAll('.count-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        questionCount = parseInt(btn.dataset.count);
    });
});

// Start button
document.getElementById('start-btn').addEventListener('click', startQuiz);

// Enter key on name input → start
document.getElementById('player-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') startQuiz();
});

// Submit button
document.getElementById('submit-btn').addEventListener('click', submitAnswer);

// Enter key on answer input
document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
});

// Email button
document.getElementById('email-btn').addEventListener('click', sendResultsEmail);

// Replay button
document.getElementById('replay-btn').addEventListener('click', () => {
    showScreen('screen-start');
    document.getElementById('email-status').style.display = 'none';
    document.getElementById('email-btn').disabled = false;
});
</script>
</body>
</html>
